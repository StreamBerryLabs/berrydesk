[workspace]
resolver = "2"
members = [
    "crates/berry-core",
    "crates/berryd",
    "crates/berry-cli",
    "crates/berry-vcam",
    "platform/linux-vcam",
]
default-members = ["crates/berry-cli", "crates/berryd"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["StreamBerryLabs"]
repository = "https://github.com/StreamBerryLabs/berrydesk"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
interprocess = "2"
shared_memory = "0.12"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
toml = "0.8"
dirs = "5"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
